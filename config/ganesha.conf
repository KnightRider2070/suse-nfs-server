# Minimal NFS Ganesha configuration to export /mnt/nfs-share
# This exports the underlying loopback filesystem using the VFS FSAL.
# Adjust as needed for your environment.

NFS_Core_Param {
    # Ganesha as NFSv4-only server by default. Change to include v3 if needed.
    Protocols = 4;
    # Disable locking daemons (optional)
    Enable_NLM = false;
}

EXPORT {
    Export_Id = 1;
    Path = "/mnt/nfs-share";
    Pseudo = "/";              # Present this export as the root
    Access_Type = "RW";
    Squash = "No_Root_Squash";
    SecType = {
        # Allow usual AUTH_SYS
        sys = {
        }
    };
    FSAL {
        Name = VFS;             # Use standard filesystem backend
    }
}
