# NFS-Ganesha Configuration for Containerized NFSv4 Server
# This configuration exports /mnt/nfs-share using the VFS FSAL
# Based on contained-ganesha best practices

NFS_Core_Param {
    # NFSv4 only for simplified, modern NFS without statd/lockd complexity
    Protocols = 4;
    
    # Bind to all interfaces
    Bind_addr = 0.0.0.0;
    
    # Port configuration (can be overridden by environment variables)
    NFS_Port = 2049;
    MNT_Port = 20048;
    
    # Disable NLM (not needed for NFSv4)
    Enable_NLM = false;
    Enable_RQUOTA = false;
    
    # Mount path pseudo for NFSv4
    mount_path_pseudo = true;
    
    # Performance tuning
    Nb_Worker = 16;
    
    # Logging (to stderr for container best practices)
    Components {
        ALL = EVENT;
    }
}

# Export configuration
EXPORT {
    # Unique export ID
    Export_Id = 1;
    
    # Filesystem path to export
    Path = "/mnt/nfs-share";
    
    # NFSv4 pseudo path (root export)
    Pseudo = "/";
    
    # Access control
    Access_Type = RW;
    
    # Squashing options
    Squash = No_Root_Squash;
    
    # Anonymous UID/GID (when squashing)
    Anonymous_Uid = 65534;
    Anonymous_Gid = 65534;
    
    # Security flavors
    SecType = sys;
    
    # Filesystem backend
    FSAL {
        Name = VFS;
        
        # VFS does not require additional parameters for basic operation
    }
    
    # Client access rules
    CLIENT {
        Clients = *;
        Access_Type = RW;
    }
    
    # Protocol support (NFSv4 only)
    Protocols = 4;
    
    # Transport protocols
    Transports = TCP;
}
