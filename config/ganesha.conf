# =============================================================================
# NFS-Ganesha Configuration — Containerised NFSv4-Only Server (VFS FSAL)
# =============================================================================
#
# Exports /mnt/nfs-share under the NFSv4 pseudo path /share.
# Clients mount via:  mount -t nfs -o vers=4.1 <server>:/share /mnt/nfs
#
# Export layout:
#   Export_Id 0  — explicit pseudo root "/" (PSEUDO FSAL, read-only listing)
#   Export_Id 1  — real data at /share        (VFS FSAL, read-write)
#
# Defining Export_Id 0 explicitly prevents Ganesha's auto-generated pseudo root
# from behaving inconsistently across versions and restarts. Without it, clients
# sometimes receive the pseudo root "/" instead of resolving down to "/share",
# causing the export to appear at /mnt/nfs/share instead of /mnt/nfs.
#
# Blocks that reload on SIGHUP without restart: EXPORT, EXPORT_DEFAULTS, LOG
# Blocks that require restart: NFS_CORE_PARAM, NFSv4, MDCACHE
# =============================================================================

# ── Core NFS parameters ──────────────────────────────────────────────────────

NFS_CORE_PARAM {
    # NFSv4 only — no NFSv3/v2 sockets, no statd/lockd/portmapper needed
    Protocols = 4;

    Bind_Addr = 0.0.0.0;
    NFS_Port = 2049;

    # Disable legacy services (not used by NFSv4)
    Enable_NLM = false;
    Enable_RQUOTA = false;

    # Must be true for NFSv4-only: tells Ganesha to resolve client path
    # lookups through the pseudo namespace rather than the physical path.
    # false causes ambiguous path resolution when pseudo and physical paths
    # differ (which they do here: Pseudo=/share, Path=/mnt/nfs-share).
    Mount_Path_Pseudo = true;

    # Worker threads: match to container CPU allocation
    Nb_Worker = 16;

    # Maximum pending requests in the dispatcher
    Dispatch_Max_Reqs = 1024;

    # Single-container deployment, no CTDB/Pacemaker
    Clustered = false;
}

# ── NFSv4 — lease and grace period tuning ────────────────────────────────────

NFSv4 {
    Lease_Lifetime = 60;

    # After restart, clients have this long to reclaim locks.
    # 45 s is a reasonable lower bound for containers.
    Grace_Period = 45;

    Graceless = false;

    Minor_Versions = 0, 1, 2;
}

# ── Metadata cache ───────────────────────────────────────────────────────────

MDCACHE {
    NParts = 7;
    Cache_Size = 32633;

    Entries_HWMark = 50000;
    Entries_Release_Size = 100;

    Dir_Chunk = 128;

    # Reduce from 60 s for multi-client environments (many Kasm containers
    # writing to the same share). A long expiry means one client can see
    # stale attributes after another client modifies a file.
    Attr_Expiration_Time_Inc = 10;
}

# ── Export defaults (inherited by all EXPORT blocks) ─────────────────────────

EXPORT_DEFAULTS {
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
}

# ── Pseudo root export ───────────────────────────────────────────────────────
#
# Export_Id 0 is the NFSv4 pseudo root. Defining it explicitly (rather than
# relying on Ganesha's auto-generation) ensures the pseudo namespace is always
# served by the PSEUDO FSAL and never falls back to a VFS root or an
# inconsistent auto-generated handle.
#
# This is what clients traverse when they first connect: the pseudo root "/"
# presents a directory listing that contains only "share" (from Export_Id 1).
# It has no physical path — the PSEUDO FSAL constructs it in memory.
#
# Access is intentionally read-only; the actual data lives in Export_Id 1.

EXPORT {
    Export_Id = 0;

    Pseudo = /;

    Access_Type = RO;
    Squash = All_Squash;

    FSAL {
        Name = PSEUDO;
    }
}

# ── Data export ──────────────────────────────────────────────────────────────
#
# Physical data export. Clients mount server:/share to reach this.

EXPORT {
    Export_Id = 1;

    # Physical path on the server filesystem
    Path = /mnt/nfs-share;

    # NFSv4 pseudo path — what clients address in their mount command
    Pseudo = /share;

    Access_Type = RW;

    # No_Root_Squash: remote root retains root access on the server.
    # Required for Kasm first_launch scripts that run as root, and for
    # Docker volume cleanup (docker volume rm / docker-compose down -v)
    # which deletes files from the daemon process running as root.
    # Without this, root from the client is squashed to nobody:65534 and
    # cannot remove root-owned files — volume cleanup fails silently.
    Squash = No_Root_Squash;

    Anonymous_Uid = 65534;
    Anonymous_Gid = 65534;

    # VFS FSAL — direct access to local ext4/xfs/btrfs
    FSAL {
        Name = VFS;
    }

    # Restrict to specific subnets in production instead of "*"
    CLIENT {
        Clients = *;
        Access_Type = RW;
        Squash = No_Root_Squash;
    }
}

# ── Logging ──────────────────────────────────────────────────────────────────

LOG {
    Default_Log_Level = EVENT;

    COMPONENTS {
        ALL = WARN;

        NFS_V4 = EVENT;
        EXPORT = EVENT;
        FSAL = EVENT;
        STATE = EVENT;

        MDCACHE = WARN;

        INIT = INFO;
        MAIN = INFO;
    }
}
