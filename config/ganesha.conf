# =============================================================================
# NFS-Ganesha Configuration — Containerised NFSv4-Only Server (VFS FSAL)
# =============================================================================
#
# Exports /mnt/nfs-share under the NFSv4 pseudo path /share.
# Clients mount via:  mount -t nfs -o vers=4.1 <server>:/share /mnt/nfs
#
# The pseudo root "/" is auto-managed by Ganesha as a lightweight directory
# listing. Actual data lives under /share. This allows adding more exports
# in the future (e.g. /logs, /backup) without conflicts.
#
# Blocks that reload on SIGHUP without restart: EXPORT, EXPORT_DEFAULTS, LOG
# Blocks that require restart: NFS_CORE_PARAM, NFSv4, MDCACHE
# =============================================================================

# ── Core NFS parameters ──────────────────────────────────────────────────────

NFS_CORE_PARAM {
    # NFSv4 only — no NFSv3/v2 sockets, no statd/lockd/portmapper needed
    Protocols = 4;

    Bind_Addr = 0.0.0.0;
    NFS_Port = 2049;

    # Disable legacy services (not used by NFSv4)
    Enable_NLM = false;
    Enable_RQUOTA = false;

    # NFSv4 uses pseudo paths natively — this is only for NFSv3 bridging
    Mount_Path_Pseudo = false;

    # Worker threads: match to container CPU allocation
    # Default 256 is excessive for a container — wastes memory
    # Rule of thumb: 2-4 workers per available CPU core
    Nb_Worker = 16;

    # Maximum pending requests in the dispatcher
    Dispatch_Max_Reqs = 1024;

    # Single-container deployment, no CTDB/Pacemaker
    Clustered = false;
}

# ── NFSv4 — lease and grace period tuning ────────────────────────────────────
#
# CRITICAL FOR CONTAINERS:
# On container restart, clients are blocked for the entire Grace_Period while
# they reclaim locks/leases. Keep this tight but safe.

NFSv4 {
    # How often clients must renew their lease (seconds)
    # Shorter = faster dead-client detection, more heartbeat overhead
    Lease_Lifetime = 60;

    # After restart, how long clients have to reclaim locks
    # Default 90s is very long for containers. 45s is a safe lower bound.
    Grace_Period = 45;

    # Do not extend grace across chained restarts
    Graceless = false;

    # Allow NFSv4.0, 4.1, and 4.2
    # 4.1 preferred: client-established TCP callbacks, session trunking
    Minor_Versions = 0, 1, 2;
}

# ── Metadata cache ───────────────────────────────────────────────────────────

MDCACHE {
    NParts = 7;
    Cache_Size = 32633;

    # Lower than bare-metal default (100000) for container memory constraints
    Entries_HWMark = 50000;
    Entries_Release_Size = 100;

    Dir_Chunk = 128;

    # How long cached attributes are trusted before re-validating against VFS
    Attr_Expiration_Time_Inc = 60;
}

# ── Export defaults (inherited by all EXPORT blocks) ─────────────────────────

EXPORT_DEFAULTS {
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
}

# ── Data export ──────────────────────────────────────────────────────────────
#
# The actual data export. Export_Id 0 is left for Ganesha's auto-generated
# pseudo root ("/") which just shows a directory listing of available exports.
# This keeps the namespace clean and allows adding exports later.

EXPORT {
    Export_Id = 1;

    # Physical path on the server filesystem
    Path = /mnt/nfs-share;

    # NFSv4 pseudo path — what clients see and mount
    # mount -t nfs -o vers=4.1 server:/share /mnt/nfs
    Pseudo = /share;

    Access_Type = RW;

    # No_Root_Squash: remote root has full root access
    # Needed for Kasm first_launch scripts that run as root
    # Restrict via CLIENT blocks to limit exposure
    Squash = No_Root_Squash;

    Anonymous_Uid = 65534;
    Anonymous_Gid = 65534;

    # VFS FSAL — direct access to local ext4/xfs/btrfs
    FSAL {
        Name = VFS;
    }

    # Client access — restrict to Docker subnet in production
    CLIENT {
        Clients = *;
        Access_Type = RW;
    }
}

# ── Logging ──────────────────────────────────────────────────────────────────
#
# Separate LOG block (not inside NFS_Core_Param — that syntax is deprecated).
# Reloads on SIGHUP without restart.

LOG {
    Default_Log_Level = EVENT;

    COMPONENTS {
        ALL = WARN;

        # NFSv4 protocol: client mount/lease/grace events
        NFS_V4 = EVENT;

        # Export and FSAL lifecycle
        EXPORT = EVENT;
        FSAL = EVENT;

        # Lock state: grace period / lease diagnostics
        STATE = EVENT;

        # Metadata cache pressure
        MDCACHE = WARN;

        # Startup/shutdown
        INIT = INFO;
        MAIN = INFO;
    }
}
